<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPMS Research Group - Publications</title>
    <link rel="icon" type="image/jpeg" href="images/1.jpg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="container">
        <div class="content1">
            <h1 class="heading-medium">Publications</h1>
            <div id="publication-stats" class="publication-stats"></div>
            <div id="publication-controls" class="publication-controls"></div>
            <div id="publications-content" class="publication-list-wrapper"></div>
        </div>
    </main>
    <footer>
        <p>High-Performance Metallic Structure (HPMS) Research Group @ University of Canterbury, New Zealand</p>
    </footer>

    <script src="scripts/publications-render.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('inputs/header.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok ' + response.statusText);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                    initializeNavigation();
                })
                .catch(error => console.error('Failed to load header.html:', error));
        });

        function initializeNavigation() {
            const menuToggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('nav');
            if (menuToggle && nav) {
                menuToggle.addEventListener('click', () => {
                    nav.classList.toggle('open');
                });
            }

            const dropdownParent = document.querySelector('.has-dropdown');
            if (dropdownParent) {
                dropdownParent.addEventListener('click', (event) => {
                    if (event.target === dropdownParent.querySelector('a')) {
                        event.preventDefault();
                        dropdownParent.classList.toggle('open');
                    }
                });

                document.addEventListener('click', (event) => {
                    if (!dropdownParent.contains(event.target)) {
                        dropdownParent.classList.remove('open');
                    }
                });

                const dropdownLinks = dropdownParent.querySelectorAll('.dropdown a');
                dropdownLinks.forEach(link => {
                    link.addEventListener('click', (event) => {
                        event.stopPropagation();
                    });
                });
            }
        }
    </script>
</body>
</html>
