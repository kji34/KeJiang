name: Update publications

on:
  # Manual only: start this workflow from the GitHub Actions tab when you want a
  # fresh Google Scholar snapshot (there is no daily schedule).
  workflow_dispatch:
    inputs:
      build:
        description: 'Also rebuild publications-data.json from publications-review.xlsx'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Refresh the raw Google Scholar snapshot
        run: python scripts/update_publications.py

      - name: Update the review workbook (new papers are flagged NEW)
        run: python scripts/publications_excel.py export

      - name: Rebuild the website data from the workbook
        if: ${{ inputs.build }}
        run: python scripts/publications_excel.py build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications-data-raw.json publications-review.xlsx publications-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update publications data"
            git push
          fi
